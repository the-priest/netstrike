<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- WiFi arcs -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="14">
    <path d="M 60 150 Q 128 80 196 150" opacity="0.95"/>
    <path d="M 84 168 Q 128 120 172 168" opacity="0.75"/>
    <path d="M 108 186 Q 128 168 148 186" opacity="0.55"/>
  </g>

  <!-- center bolt -->
  <path d="M 138 92 L 110 150 L 128 150 L 118 196 L 152 130 L 134 130 Z"
        fill="url(#bolt)" stroke="#1e1e2e" stroke-width="3" stroke-linejoin="round"/>

  <!-- signal dot -->
  <circle cx="128" cy="208" r="8" fill="#f38ba8"/>
</svg>
